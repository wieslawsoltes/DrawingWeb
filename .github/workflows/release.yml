name: Validate, publish and deploy
on:
  push:
    branches: [main]
    paths-ignore: ['.source/**', '.github/workflows/materialize.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drawingweb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Native, package and Blazor qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install browser qualification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction and native streaming contracts
        run: python tests/browser.py
      - name: Build both target frameworks and pack self-contained RCL
        run: dotnet pack blazor/DrawingWeb.Blazor/DrawingWeb.Blazor.csproj -c Release -p:RepositoryCommit=${{ github.sha }} -p:RepositoryBranch=${{ github.ref_name }} -o artifacts/nuget
      - name: Inspect NuGet payload and native assets
        run: python scripts/verify-nuget.py
      - name: Test source-generated models from the NuGet package
        run: dotnet run --project blazor/tests/DrawingWeb.ModelTests.csproj -c Release
      - name: Compile package-restored .NET 8 Server host
        run: dotnet build blazor/samples/Server/DrawingWeb.ServerSample.csproj -c Release -p:TargetFramework=net8.0
      - name: Publish package-restored .NET 10 Server and WebAssembly hosts
        run: |
          dotnet publish blazor/samples/Server/DrawingWeb.ServerSample.csproj -c Release -p:TargetFramework=net10.0 -o artifacts/server
          dotnet publish blazor/samples/WebAssembly/DrawingWeb.WebAssemblySample.csproj -c Release -o artifacts/wasm
      - name: Compose and qualify the exact Pages payload
        env: { PAGES_BASE: '/DrawingWeb/' }
        run: |
          node scripts/compose-site.mjs
          python tests/blazor-browser.py
      - name: Upload qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification
          path: |
            artifacts/browser
            artifacts/blazor-browser
          if-no-files-found: warn
      - name: Upload tested npm tarball
        uses: actions/upload-artifact@v4
        with: { name: npm-package, path: artifacts/npm/*.tgz }
      - name: Upload tested NuGet packages
        uses: actions/upload-artifact@v4
        with: { name: nuget-packages, path: artifacts/nuget/* }
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
  npm:
    name: Publish npm
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: npm
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org' }
      - uses: actions/download-artifact@v4
        with: { name: npm-package, path: artifacts/npm }
      - name: Publish immutable qualified package with provenance
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
        run: node scripts/publish.mjs npm
  nuget:
    name: Publish NuGet
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/download-artifact@v4
        with: { name: nuget-packages, path: artifacts/nuget }
      - name: Publish immutable qualified NuGet package
        env: { NUGET_API_KEY: '${{ secrets.NUGET_API_KEY }}' }
        run: node scripts/publish.mjs nuget
  pages:
    name: Deploy JavaScript studio and Blazor WebAssembly
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions: { pages: write, id-token: write }
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy qualified static payload
        id: deployment
        uses: actions/deploy-pages@v4
