name: Validate, publish and deploy
on:
  push:
    branches: [main]
    paths-ignore: ['.source/**', '.github/workflows/materialize.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drawingweb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack multi-target self-contained Blazor library
        run: dotnet pack blazor/DrawingWeb.Blazor/DrawingWeb.Blazor.csproj -c Release -p:RepositoryCommit=${{ github.sha }} -p:RepositoryBranch=${{ github.ref_name }} -o artifacts/nuget
      - run: python scripts/verify-nuget.py
      - name: Test models restored from the actual NuGet package
        run: dotnet run --project blazor/tests/DrawingWeb.ModelTests.csproj -c Release
      - name: Compile package-restored .NET 8 Server consumer
        run: dotnet build blazor/samples/Server/DrawingWeb.ServerSample.csproj -c Release -p:TargetFramework=net8.0
      - name: Publish package-restored .NET 10 Server and WASM consumers
        run: |
          dotnet publish blazor/samples/Server/DrawingWeb.ServerSample.csproj -c Release -p:TargetFramework=net10.0 -o artifacts/server
          dotnet publish blazor/samples/WebAssembly/DrawingWeb.WebAssemblySample.csproj -c Release -o artifacts/wasm
      - run: python -m pip install --quiet playwright==1.57.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium > /tmp/drawingweb-browser-install.log 2>&1 || { tail -n 80 /tmp/drawingweb-browser-install.log; exit 1; }
      - name: Browser editor, HTTP modules and IndexedDB tests
        run: python tests/browser.py
      - name: Compose Pages studio and WASM sample
        run: node scripts/compose-site.mjs
        env:
          PAGES_BASE_PATH: /DrawingWeb/
      - name: Real Server/WASM interop, EditForm, lifecycle and Pages base-path tests
        run: python tests/blazor-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-results
          path: |
            artifacts/browser
            artifacts/blazor-browser
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*nupkg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  npm:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm
      - name: Publish the tested npm tarball
        run: node scripts/publish.mjs npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  nuget:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget
      - name: Publish the tested NuGet package
        run: node scripts/publish.mjs nuget
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
