name: Source snapshot
on:
  push:
    branches: [work/visio-parity]
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=drawingweb-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: drawingweb-source
          path: drawingweb-source.tar.gz
