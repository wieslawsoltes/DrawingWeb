name: Recover interrupted parity source for review
on:
  push:
    branches: [work/recover-visio-parity]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only complete source diffs
        run: |
          python3 - <<'PY'
          import pathlib,lzma,subprocess
          parts=sorted(pathlib.Path('.recovery').glob('part-*'))
          assert len(parts)==7
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(b''.join(p.read_bytes() for p in parts),max_length=8*1024*1024)
          raw=raw[:raw.rindex(b'diff --git a/src/text.ts')]
          patch=pathlib.Path('/tmp/recovered.patch');patch.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          PY
      - name: Commit normal reviewed source on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: recover semantic diagram engine, interop and ribbon workspace source'
          git push origin HEAD:work/recover-visio-parity
          mkdir -p artifacts
          git ls-tree -r HEAD > artifacts/source-manifest.txt
          git archive --format=zip --output=artifacts/normalized-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: normalized-parity
          path: artifacts
          retention-days: 7
