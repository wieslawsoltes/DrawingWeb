name: Recover interrupted parity source for review
on:
  push:
    branches: [work/recover-visio-parity]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover supplementary source without executing it
        run: |
          mkdir -p artifacts/recovered
          python3 - <<'PY'
          import pathlib,lzma
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(pathlib.Path('.recovery/supplement').read_bytes(),max_length=8*1024*1024)
          pathlib.Path('artifacts/recovered/supplement.patch').write_bytes(raw)
          print('Recovered bytes:',len(raw),'Complete archive:',decoder.eof)
          print(raw[:500].decode('utf8',errors='replace'))
          for line in raw.decode('utf8',errors='replace').splitlines():
              if line.startswith('diff --git '): print(line)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supplementary-parity
          path: artifacts/recovered
          retention-days: 7
